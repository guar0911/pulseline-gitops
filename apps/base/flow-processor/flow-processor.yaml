apiVersion: v1
kind: Service
metadata:
  name: flow-processor
spec:
  selector:
    app.kubernetes.io/name: flow-processor
  ports:
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flow-processor
spec:
  # No replicas here: the HorizontalPodAutoscaler owns the count.
  selector:
    matchLabels:
      app.kubernetes.io/name: flow-processor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flow-processor
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: flow-processor
          image: pulseline/flow-processor
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: pulseline-config
            - secretRef:
                name: pulseline-secrets
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          # The HorizontalPodAutoscaler measures CPU use against this request.
          # An idle consumer uses about 40m, well under the 60% target.
          resources:
            requests:
              cpu: 250m
              memory: 192Mi
            limits:
              cpu: '1'
              memory: 384Mi
