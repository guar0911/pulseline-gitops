# Applies pending database migrations; the ones already applied are skipped.
# Argo CD runs it as a hook on every sync, replacing the Job of the previous
# sync. It retries until PostgreSQL accepts connections.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: migrate
          image: pulseline/flow-processor
          command: ['node', 'node_modules/@pulseline/database/dist/migrate.js']
          envFrom:
            - configMapRef:
                name: pulseline-config
            - secretRef:
                name: pulseline-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
