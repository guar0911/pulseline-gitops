apiVersion: v1
kind: Service
metadata:
  name: flow-api
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: flow-api
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30030
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flow-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: flow-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flow-api
    spec:
      # Without this, Kubernetes injects FLOW_API_PORT=tcp://... for the Service
      # of the same name, which collides with the port setting of the app.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: flow-api
          image: pulseline/flow-api
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: pulseline-config
            - secretRef:
                name: pulseline-secrets
          # Startup: give the app time to connect before the other probes count.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 20
          # Liveness: the process answers. A failure restarts the container.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # Readiness: PostgreSQL and Kafka are reachable. A failure only takes
          # the pod out of the Service until it recovers.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
